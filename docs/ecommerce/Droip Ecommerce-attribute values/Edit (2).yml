info:
  name: Edit (2)
  type: http
  seq: 3
  tags:
    - Droip Ecommerce/attribute values

http:
  method: PUT
  url: "{{baseUrl}}/attributes/1/values/23"
  body:
    type: json
    data: |-
      {
        "attribute_id": 1,
        "value": "Navy Blue",
        "color": "#0000022"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/attributes/1/values/23"
      method: PUT
      body:
        type: json
        data: |-
          {
            "attribute_id": 1,
            "value": "Navy Blue",
            "color": "#0000022"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 23,
              "value": "Navy Blue",
              "color": "#0000022"
            },
            "message": "Attribute value updated successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/attributes/1/values/23"
      method: PUT
      body:
        type: json
        data: |-
          {
            "attribute_id": 1,
            "value": "Navy Blue",
            "color": "#0000022"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

