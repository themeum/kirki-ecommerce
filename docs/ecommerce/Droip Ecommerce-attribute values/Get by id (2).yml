info:
  name: Get by id (2)
  type: http
  seq: 2
  tags:
    - Droip Ecommerce/attribute values

http:
  method: GET
  url: "{{baseUrl}}/attributes/1/values/23"
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/attributes/1/values/23"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 23,
              "value": "Navy Blue",
              "color": "#0000022"
            },
            "message": "Attribute value retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/attributes/1/values/23"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Attribute not found."
          }

docs: |-
  # Get Tag By ID
  Returns the details of a specific resource identified by its ID.
