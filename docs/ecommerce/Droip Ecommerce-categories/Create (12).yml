info:
  name: Create (12)
  type: http
  seq: 2
  tags:
    - Droip Ecommerce/categories

http:
  method: POST
  url: "{{baseUrl}}/categories"
  body:
    type: json
    data: |-
      {
        "parent_id": null,
        "name": "Cargo",
        "slug": "cargo",
        "description": "loosely brace pfft",
        "image": null,
        "count": 0,
        "level": 2,
        "ordering": 0,
        "is_active": false,
        "is_deletable": false
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/categories"
      method: POST
      body:
        type: json
        data: |-
          {
            "parent_id": null,
            "name": "Cargo",
            "slug": "cargo",
            "description": "loosely brace pfft",
            "image": null,
            "count": 0,
            "level": 2,
            "ordering": 0,
            "is_active": false,
            "is_deletable": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "parent_id": 0,
              "name": "Little, Kertzmann and Kling",
              "slug": "little-kertzmann-and-kling",
              "description": "although egg",
              "image": null,
              "level": 1,
              "ordering": 0,
              "is_active": true,
              "is_deletable": true,
              "created_at": {
                "date": "2025-10-24 08:55:23.797566",
                "timezone_type": 3,
                "timezone": "UTC"
              },
              "updated_at": {
                "date": "2025-10-24 08:55:23.797566",
                "timezone_type": 3,
                "timezone": "UTC"
              },
              "id": 1
            },
            "message": "Category created successfully."
