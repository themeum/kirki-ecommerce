  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/categories"
      method: POST
      body:
        type: json
        data: |-
          {
            "parent_id": null,
            "name": "Cargo",
            "slug": "cargo",
            "description": "loosely brace pfft",
            "image": null,
            "count": 0,
            "level": 2,
            "ordering": 0,
            "is_active": false,
            "is_deletable": false
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

docs: |-
  # Create Category

  ## 1. Detailed description of the API function
  This API is designed to create categories. It expects form - data parameters such as `name`, `slug`, and `description`, etc in the request body.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.
