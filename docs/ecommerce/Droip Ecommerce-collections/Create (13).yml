info:
  name: Create (13)
  type: http
  seq: 2
  tags:
    - Droip Ecommerce/collections

http:
  method: POST
  url: "{{baseUrl}}/collections"
  body:
    type: json
    data: |-
      {
        "title": "T-Shirts",
        "slug": "t-shirts",
        "description": "Test desc",
        "banner": 10,
        "count": 0,
        "seo_title": "test",
        "seo_description": "test desc",
        "seo_keywords": "test, foo, baar",
        "is_active": true,
        "ordering": 0
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/collections"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "T-Shirts",
            "slug": "t-shirts",
            "description": "Test desc",
            "banner": 10,
            "count": 0,
            "seo_title": "test",
            "seo_description": "test desc",
            "seo_keywords": "test, foo, baar",
            "is_active": true,
            "ordering": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "title": "T-Shirts",
              "slug": "t-shirts",
              "description": "test desc",
              "banner": 4,
              "seo_title": "test",
              "seo_description": "test desc",
              "seo_keywords": "test, foo, baar",
              "is_active": true,
              "ordering": 0,
              "created_at": {
                "date": "2025-10-24 10:37:15.418099",
                "timezone_type": 3,
                "timezone": "UTC"
              },
              "updated_at": {
                "date": "2025-10-24 10:37:15.418099",
                "timezone_type": 3,
                "timezone": "UTC"
              },
              "id": 6
            },
            "message": "Collection created successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/collections"
      method: POST
      body:
        type: json
        data: |-
          {
            "title": "T-Shirts",
            "slug": "t-shirts",
            "description": "Test desc",
            "banner": 10,
            "count": 0,
            "seo_title": "test",
            "seo_description": "test desc",
            "seo_keywords": "test, foo, baar",
            "is_active": true,
            "ordering": 0
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "banner": [
                "The banner field must be of type integer."
              ]
            },
            "message": "Validation failed!"
          }

docs: |-
  # Create Collection

  ## 1. Detailed description of the API function
  This API is designed to create collections. It expects form - data parameters such as `name`, `slug`, and `description`, etc in the request body.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.
