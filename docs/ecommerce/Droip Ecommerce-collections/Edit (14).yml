info:
  name: Edit (14)
  type: http
  seq: 4
  tags:
    - Droip Ecommerce/collections

http:
  method: PUT
  url: "{{baseUrl}}/collections/8"
  body:
    type: json
    data: |-
      {
        "title": "Shirts",
        "description": "test desc",
        "banner": 4,
        "seo_title": "test",
        "seo_description": "test desc",
        "seo_keywords": "test, foo, baar",
        "is_active": true,
        "ordering": 0
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/collections/8"
      method: PUT
      body:
        type: json
        data: |-
          {
            "title": "Shirts",
            "description": "test desc",
            "banner": 4,
            "seo_title": "test",
            "seo_description": "test desc",
            "seo_keywords": "test, foo, baar",
            "is_active": true,
            "ordering": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 8,
              "title": "Shirts",
              "slug": "shirts",
              "description": "test desc",
              "banner": "4",
              "seo_title": "test",
              "seo_description": "test desc",
              "seo_keywords": "test, foo, baar",
              "is_active": true,
              "ordering": 0,
              "created_at": "2025-10-24 10:42:58",
              "updated_at": "2025-10-24 10:42:58"
            },
            "message": "Collection updated successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/collections/8"
      method: PUT
      body:
        type: json
        data: |-
          {
            "title": "Shirts",
            "description": "test desc",
            "banner": 4,
            "seo_title": "test",
            "seo_description": "test desc",
            "seo_keywords": "test, foo, baar",
            "is_active": true,
            "ordering": 0
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Collection could not be updated."
          }

