info:
  name: Bulk actions (1)
  type: http
  seq: 2
  tags:
    - Droip Ecommerce/currencies
    - Droip Ecommerce/categories
    - Droip Ecommerce/collections

http:
  method: POST
  url: "{{baseUrl}}/categories/bulk"
  body:
    type: json
    data: |-
      {
        "action": "delete",
        "ids": [
          6
        ]
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/categories/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              6
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": true,
            "message": "Category deleted successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/categories/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              6
            ]
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Categories could not be deleted."
          }

docs: |-
  ## Bulk Actions

  Performs a specified action (e.g., delete) on multiple resources identified by their IDs.
