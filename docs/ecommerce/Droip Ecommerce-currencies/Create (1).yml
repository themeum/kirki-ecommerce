info:
  name: Create (1)
  type: http
  seq: 4
  tags:
    - Droip Ecommerce/currencies

http:
  method: POST
  url: "{{baseUrl}}/currencies"
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "name": "USD",
            "code": "USD",
            "symbol": "$",
            "exchange_rate": 1,
            "is_base": true,
            "is_active": true
          },
          {
            "name": "BDT",
            "code": "bdt",
            "symbol": "$",
            "exchange_rate": 121,
            "is_base": true,
            "is_active": true
          }
        ]
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

