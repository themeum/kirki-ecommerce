info:
  name: Get by id (GET)
  type: http
  seq: 2
  tags:
    - Droip Ecommerce/customers

http:
  method: GET
  url: "{{baseUrl}}/customers/1"
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

