info:
  name: all pages
  type: http
  seq: 1
  tags:
    - Droip Ecommerce/pages

http:
  method: GET
  url: "{{baseUrl}}/pages"
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/pages"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": 2,
                "title": "Sample Page",
                "slug": "sample-page",
                "status": "publish",
                "created_at": "2025-10-22 09:18:31",
                "updated_at": "2025-10-22 09:18:31"
              }
            ],
            "message": "Pages retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/pages"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |-
  ## Page List
  Returns all the pages
