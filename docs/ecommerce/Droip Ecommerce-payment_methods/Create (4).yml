  tags:
    - Droip Ecommerce/payment_methods

http:
  method: POST
  url: "{{baseUrl}}/payment-methods"
  body:
    type: json
    data: |-
      {
        "is_enabled": true,
        "is_manual": false,
        "name": "Bkash2",
        "icon": "cash",
        "instructions": "Bkash2",
        "config": {}
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
