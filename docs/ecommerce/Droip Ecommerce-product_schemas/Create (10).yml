info:
  name: Create (10)
  type: http
  seq: 4
  tags:
    - Droip Ecommerce/product_schemas

http:
  method: POST
  url: "{{baseUrl}}/product-schemas"
  body:
    type: json
    data: |-
      {
        "name": "Schema 1",
        "is_default": false,
        "schema": {
          "name": "Something",
          "description": "Something more"
        }
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

