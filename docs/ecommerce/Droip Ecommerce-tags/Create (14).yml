info:
  name: Create (14)
  type: http
  seq: 1
  tags:
    - Droip Ecommerce/tags

http:
  method: POST
  url: "{{baseUrl}}/tags"
  body:
    type: json
    data: |-
      {
        "name": "Tech",
        "slug": "tech",
        "description": "Tech desc"
      }
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

