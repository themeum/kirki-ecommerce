docs: |-
  # Create Tag

  ## 1. Detailed description of the API function
  This API is designed to create tags. It expects form - data parameters such as `name`, `slug`, and `description` in the request body. The `name` is likely a noun representing the tag name, the `slug` is a URL - friendly identifier for the tag, and the `description` provides more details about the tag.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.

  ### Example Usage
  #### Request
  ```json
  {
      "name": "SampleTagName",
      "slug": "sample - tag - slug",
      "description": "This is a sample tag description"
  }
  ```
  #### Response
  ```json
  {
      "success": true,
      "message": "Tag created successfully"
  }
  ```
