info:
  name: Create a new user
  type: http
  seq: 2
  tags:
    - Samples

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "id": 0,
        "username": "echo api",
        "firstName": "Echo",
        "lastName": "Api",
        "email": "support@echoapi.com",
        "password": "12345",
        "phone": "",
        "userStatus": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Username already exists
    request:
      url: "{{baseUrl}}/users"
      method: POST
      body:
        type: json
        data: |-
          {
            "id": 0,
            "username": "echo api",
            "firstName": "Echo",
            "lastName": "Api",
            "email": "support@echoapi.com",
            "password": "12345",
            "phone": "",
            "userStatus": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": 1,
            "msg": "Username already exists"
          }
