info:
  name: Delete user
  type: http
  seq: 5
  tags:
    - Samples

http:
  method: DELETE
  url: "{{baseUrl}}/users/:username"
  params:
    - name: username
      value: echo api
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: User not found
    request:
      url: "{{baseUrl}}/users/:username"
      method: DELETE
      params:
        - name: username
          value: echo api
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": 1,
            "msg": "User not found"
          }
