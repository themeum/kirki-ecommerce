info:
  name: Get user info
  type: http
  seq: 3
  tags:
    - Samples

http:
  method: GET
  url: "{{baseUrl}}/users/:username"
  params:
    - name: username
      value: echo api
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Successful response
    request:
      url: "{{baseUrl}}/users/:username"
      method: GET
      params:
        - name: username
          value: echo api
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": 0,
            "msg": "",
            "user": {
              "id": 0,
              "username": "",
              "firstName": "",
              "lastName": "",
              "email": "",
              "password": "",
              "phone": "",
              "userStatus": 0
            }
          }
