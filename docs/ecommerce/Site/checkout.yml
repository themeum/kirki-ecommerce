docs: |-
  # Checkout

  ## 1. Detailed description of the API function
  Places an order for the current shopper (guest or logged-in) from the payload and returns the order as the storefront sees it. Every amount in the response is an `invoiced_*` money object in the order's own currency; base-currency amounts are never exposed on this endpoint.

  ## 2. Item strikethrough price
  Each entry in `data.items` may carry `invoiced_strikethrough_price_money_object`, the amount the storefront should render struck through beside the item's `invoiced_subtotal_money_object`:

  1. An item-scoped (product) coupon reduced the item: the strikethrough amount is the item's subtotal before that coupon, which is already the sale price if the item was also bought on sale.
  2. Otherwise, the item was bought on sale: the strikethrough amount is the regular price multiplied by the quantity.
  3. Otherwise it is `null`.

  An order-wide coupon never sets it. Orders placed before the regular price was recorded have no sale strikethrough; an item reduced by an item-scoped coupon still gets the coupon-based one.

  ## 3. Notes
  The country objects list only a couple of `states` here; the real response lists every state of the country.
