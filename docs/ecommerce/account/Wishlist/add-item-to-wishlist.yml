info:
  name: wishlist
  type: http
  seq: 4
  tags:
    - wishlist

http:
  method: POST
  url: "{{baseUrl}}/account/wishlist"
  body:
    type: json
    data: |-
      {
        "product_id": 3,
        "variant_id": 98095
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 201 Response
    description: Success - Item added to wishlist
    request:
      url: "{{baseUrl}}/wishlist"
      method: POST
      body:
        type: json
        data: |-
          {
            "product_id": 3,
            "variant_id": 5
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": 1,
              "user_id": 2,
              "variant_id": 5,
              "product_id": 3,
              "title": "Classic Cotton T-Shirt",
              "name": "Classic Cotton T-Shirt",
              "slug": "classic-cotton-t-shirt",
              "product_url": "http://example.com/shop/classic-cotton-t-shirt",
              "url": "http://example.com/shop/classic-cotton-t-shirt",
              "image": "http://example.com/wp-content/uploads/2026/01/tshirt.jpg",
              "image_url": "http://example.com/wp-content/uploads/2026/01/tshirt.jpg",
              "price": 25,
              "display_price": "$25.00",
              "formatted_regular_price": "$30.00",
              "in_sale": true,
              "out_of_stock": false,
              "created_at": "2026-09-08 10:00:00",
              "updated_at": "2026-09-08 10:00:00"
            },
            "message": "Item added to wishlist successfully."
          }
  - name: 404 Response (product)
    description: Failure - Product not found or not published
    request:
      url: "{{baseUrl}}/wishlist"
      method: POST
      body:
        type: json
        data: |-
          {
            "product_id": 999999
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Product not found."
          }
  - name: 404 Response (variant)
    description: Failure - The variant does not exist or does not belong to the product
    request:
      url: "{{baseUrl}}/wishlist"
      method: POST
      body:
        type: json
        data: |-
          {
            "product_id": 3,
            "variant_id": 999999
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Variant not found."
          }
  - name: 401 Response
    description: Failure - Not logged in
    request:
      url: "{{baseUrl}}/wishlist"
      method: POST
      body:
        type: json
        data: |-
          {
            "product_id": 3
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "rest_forbidden",
            "message": "You have to be logged in.",
            "data": {
              "status": 401
            }
          }

docs: |-
  ## Add Item to Wishlist

  Adds a product to the authenticated user's wishlist. A user has one entry per product.

  - Requires `product_id` in the request body. The product must exist and be published.
  - `variant_id` is optional. Send it when the user chose a variant. It must belong to `product_id`.
  - Without `variant_id`, the entry has no variant, and the wishlist shows the product's default variant.
  - If the product is already on the wishlist, the existing entry is returned. A `variant_id` in the request replaces the entry's variant. No `variant_id` leaves the entry unchanged.
  - The response is the product card. `variant_id` is the variant the card shows, which may be the default variant.
