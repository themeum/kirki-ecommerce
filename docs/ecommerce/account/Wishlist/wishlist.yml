info:
  name: wishlist
  type: http
  seq: 1
  tags:
    - wishlist

http:
  method: GET
  url: "{{baseUrl}}/account/wishlist?page=1&limit=10&sort_by=id&sort_order=desc"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: sort_by
      value: id
      type: query
    - name: sort_order
      value: desc
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Success - Returns paginated list of wishlist items for the authenticated user
    request:
      url: "{{baseUrl}}/wishlist"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "results": [
                {
                  "id": 1,
                  "user_id": 2,
                  "variant_id": 5,
                  "product_id": 3,
                  "title": "Classic Cotton T-Shirt",
                  "name": "Classic Cotton T-Shirt",
                  "slug": "classic-cotton-t-shirt",
                  "product_url": "http://example.com/shop/classic-cotton-t-shirt",
                  "url": "http://example.com/shop/classic-cotton-t-shirt",
                  "image": "http://example.com/wp-content/uploads/2026/01/tshirt.jpg",
                  "image_url": "http://example.com/wp-content/uploads/2026/01/tshirt.jpg",
                  "price": 25,
                  "display_price": "$25.00",
                  "formatted_regular_price": "$30.00",
                  "in_sale": true,
                  "out_of_stock": false,
                  "created_at": "2026-09-08 10:00:00",
                  "updated_at": "2026-09-08 10:00:00"
                }
              ],
              "total": 1,
              "count": 1,
              "per_page": 10,
              "current_page": 1,
              "last_page": 1,
              "from": 1,
              "to": 1,
              "has_more_pages": false
            },
            "message": "Wishlist retrieved successfully."
          }
  - name: 401 Response
    description: Failure - Not logged in
    request:
      url: "{{baseUrl}}/wishlist"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "rest_forbidden",
            "message": "You have to be logged in.",
            "data": {
              "status": 401
            }
          }

docs: |-
  ## Get Wishlist

  Retrieves paginated wishlist items belonging to the currently authenticated user.

  - Requires authentication (`AuthMiddleware`).
  - Supports `ListFilterDTO` parameters: `page`, `limit` (`-1` for all), `sort_by`, `sort_order`.
  - Returns paginated envelope with product and variant details (title, slug, pricing, sale status, stock status, images, and URLs).
