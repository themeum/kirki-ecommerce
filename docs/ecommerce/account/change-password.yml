info:
  name: Change Password
  type: http
  seq: 2
  tags:
    - account

http:
  method: PUT
  url: "{{baseUrl}}/account/password-change"
  body:
    type: json
    data: |-
      {
        "current_password": "OldPass123!",
        "new_password": "NewPass456!",
        "new_password_confirmation": "NewPass456!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/account/password-change"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "OldPass123!",
            "new_password": "NewPass456!",
            "new_password_confirmation": "NewPass456!"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": true,
            "message": "Password changed successfully.",
            "success": true
          }
  - name: 422 Response (wrong current password)
    description: Failure
    request:
      url: "{{baseUrl}}/account/password-change"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "WrongPass!",
            "new_password": "NewPass456!",
            "new_password_confirmation": "NewPass456!"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Validation failed!",
            "errors": {
              "current_password": [
                "Current password is incorrect."
              ]
            },
            "success": false
          }
  - name: 422 Response (too short / confirmation mismatch)
    description: Failure
    request:
      url: "{{baseUrl}}/account/password-change"
      method: PUT
      body:
        type: json
        data: |-
          {
            "current_password": "OldPass123!",
            "new_password": "short",
            "new_password_confirmation": "nope"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Validation failed!",
            "errors": {
              "new_password": [
                "The new_password field must be at least 8 characters long."
              ],
              "new_password_confirmation": [
                "The new_password_confirmation field must match the new_password field."
              ]
            },
            "success": false
          }

docs: |-
  ## Change Password

  Changes the **currently authenticated user's own** WordPress password.

  - `current_password` is verified with `wp_check_password()` before anything
    is changed — a wrong value rejects the request with a 422 and the password
    is left untouched.
  - `new_password` must be at least `Constants\Password::MIN_LENGTH` (8)
    characters, and `new_password_confirmation` must match it exactly.
  - `wp_set_password()` invalidates the current auth cookie for the user being
    changed as a side effect — this endpoint immediately re-issues it
    (`wp_set_auth_cookie()`) afterward, so the browser that just changed the
    password stays logged in instead of being silently signed out.
  - Handled by `App\Services\UserService::update_password()`, called directly
    from the controller — this is a single WordPress-core operation, so there's
    no Action/DTO layer for it (unlike Update Profile / Update Addresses, which
    each touch more than one thing and need a transaction).
