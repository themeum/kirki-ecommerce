info:
  name: Delete Address
  type: http
  seq: 9
  tags:
    - account

http:
  method: DELETE
  url: "{{baseUrl}}/account/addresses/24"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/account/addresses/24"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": true,
            "message": "Address deleted successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure — id doesn't exist, or belongs to a different customer
    request:
      url: "{{baseUrl}}/account/addresses/999999"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Address not found.",
            "success": false
          }
  - name: 401 Response
    description: Failure — not logged in
    request:
      url: "{{baseUrl}}/account/addresses/24"
      method: DELETE
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "rest_forbidden",
            "message": "You have to be logged in.",
            "data": {
              "status": 401
            }
          }

docs: |-
  ## Delete Address

  Deletes an address, scoped to the **currently authenticated** customer.

  - If the deleted address was a default shipping and/or billing address,
    that purpose is simply left with **no default** — no other address is
    automatically promoted. The next `set-default` call (or a new address)
    is what re-establishes one.
  - Requires a logged-in WordPress user (401 otherwise) and an id that
    belongs to that customer (404 otherwise, whether the id doesn't exist or
    belongs to someone else).
