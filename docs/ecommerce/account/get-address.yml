info:
  name: Get Address
  type: http
  seq: 6
  tags:
    - account

http:
  method: GET
  url: "{{baseUrl}}/account/addresses/23"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/account/addresses/23"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": 23,
              "customer_id": 12,
              "type": "home",
              "label": "Weekend Home",
              "first_name": "Sarah",
              "last_name": "Johnson",
              "address_line1": "123 New St",
              "address_line2": "",
              "city": "Boston",
              "state": "MA",
              "country": "US",
              "postal_code": "02101",
              "email": "sarah.johnson@example.com",
              "phone": "+1-555-9999",
              "is_default_shipping": true,
              "is_default_billing": false,
              "created_at": "2026-09-04T08:03:53.000000Z",
              "updated_at": "2026-09-04T08:03:53.000000Z"
            },
            "message": "Address retrieved successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure — id doesn't exist, or belongs to a different customer
    request:
      url: "{{baseUrl}}/account/addresses/999999"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Address not found.",
            "success": false
          }
  - name: 401 Response
    description: Failure — not logged in
    request:
      url: "{{baseUrl}}/account/addresses/23"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "rest_forbidden",
            "message": "You have to be logged in.",
            "data": {
              "status": 401
            }
          }

docs: |-
  ## Get Address

  Returns a single address by id, scoped to the **currently authenticated**
  customer.

  - Requires a logged-in WordPress user (401 otherwise).
  - An id that belongs to a different customer returns the same 404 as an id
    that doesn't exist at all — this endpoint never reveals whether an id
    belongs to someone else.
