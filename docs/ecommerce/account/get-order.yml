docs: |-
  ## Get Order By Id (Account)

  Returns the full details of a single order, but only when it belongs to the
  **currently authenticated customer**. Identity always comes from the
  logged-in session (`AuthMiddleware` + resolving the `Customer` linked to
  `user()->get_id()`), never from client input.

  - An order that exists but belongs to a **different** customer returns the
    exact same `404` / `"Order not found."` response as an order id that
    doesn't exist at all — ownership is never revealed to the requester.
  - If the authenticated user has no linked `Customer` record, every request
    to this endpoint fails the same way (`404`) — there's no order they could
    own.
  - Requires a logged-in WordPress user (401 otherwise).
  - The response body intentionally **omits** the admin-only `admin_notes` and
    `flags` fields present on the admin order details response
    (`App\Resources\Order\OrderResource`) — this endpoint uses its own
    `App\Resources\Site\Account\OrderResource`, which lists only
    customer-safe fields explicitly rather than inheriting and subtracting.
  - Includes `payment_next_step` (same shape as the checkout-confirmation
    response: `{ "type": "redirect" | "html", "value": "..." }`), so an unpaid
    order can offer a "pay now" retry. It resolves to `null` when the order's
    `payment_provider` has no matching registered/enabled gateway.
