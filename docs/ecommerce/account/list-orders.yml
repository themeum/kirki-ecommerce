docs: |-
  ## List Orders (Account)

  Returns a paginated list of orders belonging only to the **currently
  authenticated customer**. There is no `customer_id` path segment: identity
  always comes from the logged-in session (`AuthMiddleware` + resolving the
  `Customer` linked to `user()->get_id()`), never from client input.

  - Supports the same `search`, `sort_by`, `sort_order`, `page`, and `limit`
    query parameters as the admin `GET /orders` list, applied within the
    requester's own orders only.
  - A `customer_id` value in the query string is **ignored** — the response
    always reflects the requester's own customer id, never a client-supplied
    one.
  - If the authenticated user has no linked `Customer` record (they've never
    completed checkout), the response is an empty, successfully-paginated list
    rather than an error — a `Customer` record is provisioned during checkout,
    so "zero orders" is the correct answer here, not a failure case.
  - Requires a logged-in WordPress user (401 otherwise).
  - Reuses the admin list's `App\Resources\Order\OrderListResource` unchanged
    — it already contains no internal-only fields.
