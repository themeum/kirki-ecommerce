info:
  name: Order Activities
  type: http
  seq: 4
  tags:
    - account

http:
  method: GET
  url: "{{baseUrl}}/account/orders/29/activities"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/account/orders/29/activities"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": 12,
                "order_id": 29,
                "activity_type": "comment-added",
                "activity_type_label": "Comment Added",
                "description": "Packed and ready to ship.",
                "metadata": null,
                "created_by": 1,
                "author_name": "Admin",
                "created_at": "2026-08-23 14:02:10"
              },
              {
                "id": 1,
                "order_id": 29,
                "activity_type": "order-placed",
                "activity_type_label": "Order Placed",
                "description": "Order placed for Classic Cotton T-Shirt #ORD-695CEA20C3A9D",
                "metadata": {
                  "order_number": "ORD-695CEA20C3A9D",
                  "is_manual": false,
                  "item_summary": "Classic Cotton T-Shirt"
                },
                "created_by": 2,
                "author_name": "Jane Doe",
                "created_at": "2026-01-07 17:19:56"
              }
            ],
            "message": "Activities retrieved successfully."
          }
  - name: 404 Response
    description: Failure (order does not exist, or belongs to another customer)
    request:
      url: "{{baseUrl}}/account/orders/29/activities"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Order not found.",
            "success": false
          }
  - name: 401 Response
    description: Failure
    request:
      url: "{{baseUrl}}/account/orders/29/activities"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "You have to be logged in.",
            "success": false
          }

docs: |-
  ## Order Activities (Customer)

  Returns the **currently authenticated customer's own** view of an
  order's activity timeline — the exact same activities an admin sees on
  **Orders → List Activities**, admin comments included. There is no
  visibility split between "internal" and "customer-facing" activities.

  - Identity always comes from the logged-in session (`AuthMiddleware` +
    `customer()->get_customer_id()`); ownership is checked against the
    order's `customer_id`.
  - An order that doesn't exist, or exists but isn't owned by the
    requesting customer, returns 404 either way — a non-owned order is
    never distinguished from a missing one.
