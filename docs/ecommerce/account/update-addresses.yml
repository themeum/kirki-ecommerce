info:
  name: Update Addresses
  type: http
  seq: 3
  tags:
    - account

http:
  method: PUT
  url: "{{baseUrl}}/account/addresses"
  body:
    type: json
    data: |-
      {
        "type": "shipping",
        "first_name": "Sarah",
        "last_name": "Johnson",
        "email": "sarah.johnson@example.com",
        "phone": "+1-555-9999",
        "address_line1": "123 New St",
        "address_line2": "",
        "city": "Boston",
        "state": "MA",
        "postal_code": "02101",
        "country": "US",
        "is_billing_same_as_shipping": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

