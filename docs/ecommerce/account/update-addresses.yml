docs: |-
  ## Update Addresses

  Updates **one** of the currently authenticated customer's addresses per
  request — shipping or billing, discriminated by `type`. This never touches
  both addresses at once (unlike the admin `PUT /customers/{id}` endpoint,
  which updates shipping and billing together).

  - `type` is required: `shipping` or `billing`.
  - A **billing** update (`type: "billing"`) also requires
    `is_billing_same_as_shipping`, which is persisted on the customer's own
    record:
    - `true` — the billing address is set to match the customer's *current*
      shipping address; any address fields in the body are ignored. This is a
      one-time copy, not an ongoing link — a later shipping update in a
      separate request won't automatically re-sync billing.
    - `false` — the billing address is updated from the submitted fields,
      which are then required.
  - A **shipping** update (`type: "shipping"`) never needs
    `is_billing_same_as_shipping`, and the customer's existing value for it is
    left unchanged.
  - Requires a logged-in WordPress user (401 otherwise) whose account already
    has a linked `Customer` record with both a shipping and billing address
    (404 otherwise).
