info:
  name: Create
  type: http
  seq: 2
  tags:
    - attributes

http:
  method: POST
  url: "{{baseUrl}}/attributes"
  body:
    type: json
    data: |-
      {
        "name": "Material",
        "slug": "material",
        "type": "list"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/attributes"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Material",
            "slug": "material",
            "type": "list"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 9,
              "name": "Material",
              "slug": "material",
              "type": "list",
              "values": [],
              "created_at": {
                "date": "2025-12-23 06:52:38.704108",
                "timezone_type": 3,
                "timezone": "UTC"
              },
