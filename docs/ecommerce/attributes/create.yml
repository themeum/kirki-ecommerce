  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/attributes"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Material",
            "slug": "material",
            "type": "list"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Only one color attribute is allowed."
          }

docs: |-
  # Create Attribute

  ## 1. Detailed description of the API function
  This API is designed to create attribute. It expects form - data parameters such as `name`, `slug`, and `type` in the request body. The `name` is likely a noun representing the tag name, the `slug` is a URL - friendly identifier for the tag, and the `type` provides the type of of input field it needs.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.
