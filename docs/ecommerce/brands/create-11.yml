info:
  name: Create (Brand)
  type: http
  seq: 4
  tags:
    - brands

http:
  method: POST
  url: "{{baseUrl}}/brands"
  body:
    type: json
    data: |-
      {
        "name": "Google",
        "slug": "Google",
        "description": "qua inasmuch discrete",
        "logo": 7,
        "website_url": "https://google.com",
        "is_active": true
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

