docs: |-
  # Create Brand

  ## 1. Detailed description of the API function
  This API is designed to create brands. It expects form - data parameters such as `name`, `slug`, and `description` in the request body. The `name` is likely a noun representing the brand name, the `slug` is a URL - friendly identifier for the brand, and the `description` provides more details about the brand.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.
