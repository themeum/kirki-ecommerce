http:
  method: GET
  url: "{{baseUrl}}/collections"
  params:
    - name: search
      value: ""
      type: query
    - name: sort_by
      value: title
      type: query
    - name: sort_order
      value: asc
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

