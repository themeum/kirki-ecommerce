  tags:
    - currencies

http:
  method: PUT
  url: "{{baseUrl}}/currencies"
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "id": 1,
            "name": "British Dollar",
            "code": "GBP",
            "symbol": "$",
            "exchange_rate": 1,
            "is_base": true,
            "is_active": true,
            "created_at": "2026-01-30 12:21:56",
            "updated_at": "2026-02-25 09:03:28"
          }
        ]
