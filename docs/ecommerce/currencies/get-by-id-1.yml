info:
  name: Get By Id (Currency)
  type: http
  seq: 3
  tags:
    - currencies

http:
  method: GET
  url: "{{baseUrl}}/currencies/1"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/currencies/1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 1,
              "name": "USD",
              "code": "usd",
              "symbol": "$",
              "exchange_rate": 1,
              "is_base": false,
              "is_active": true,
              "created_at": "2025-11-05 05:48:33",
              "updated_at": "2025-11-05 05:54:53"
            },
            "message": "Currency retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/currencies/1"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Currency not found."
          }

docs: |-
  # Get Currencies By ID
  Returns the details of a specific resource identified by its ID.
