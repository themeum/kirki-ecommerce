info:
  name: Available Providers List
  type: http
  seq: 1
  tags:
    - currency-exchange

http:
  method: GET
  url: "{{baseUrl}}/currency-exchange/providers"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/currency-exchange/providers"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "exchange_rates_api",
                "name": "Exchange Rates API",
                "icon": "http://droip.local/wp-content/droip-apps-dev/apps/Ecommerce/resources//images/currency-exchange-providers/exchangeratesapi.png",
                "description": "Exchange Rates API"
              },
              {
                "id": "currency_api",
                "name": "CurrencyApi",
                "icon": "http://droip.local/wp-content/droip-apps-dev/apps/Ecommerce/resources//images/currency-exchange-providers/currencyapi.png",
                "description": "CurrencyApi.com - Free & reliable currency data API"
              }
            ],
            "message": "Currency exchange providers retrieved successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/currency-exchange/providers"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

docs: |-
  # Available Currency Exchange Provider List

  This api provides the list of available currency exchange providers supported by the platform.
