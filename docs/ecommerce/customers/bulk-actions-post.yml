info:
  name: Bulk Actions (POST)
  type: http
  seq: 1
  tags:
    - customers

http:
  method: POST
  url: "{{baseUrl}}/customers/bulk"
  body:
    type: json
    data: |-
      {
        "action": "delete",
        "ids": [
          8,
          9
        ]
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/customers/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              8,
              9
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": true,
            "message": "Customer deleted successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/customers/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              8,
              9
            ]
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "customers could not be deleted."
          }

docs: |-
  ## Bulk Actions

  Performs a specified action (e.g., delete) on multiple resources identified by their IDs.
