info:
  name: Edit (Payment Method)
  type: http
  seq: 2
  tags:
    - offline-payments

http:
  method: PUT
  url: "{{baseUrl}}/offline-payments/fdsf"
  body:
    type: json
    data: |-
      {
        "is_enabled": true,
        "is_offline": false,
        "name": "Bkash222",
        "icon": "cash",
        "instructions": "Bkash2"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/offline-payments/fdsf"
      method: PUT
      body:
        type: json
        data: |-
          {
            "is_enabled": true,
            "is_offline": false,
            "name": "Bkash222",
            "icon": "cash",
            "instructions": "Bkash2"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": "98cfccbb-9f87-41d7-b66a-95ab95502ff9",
              "name": "Bkash222",
              "icon": "cash",
              "is_enabled": true,
              "is_offline": false,
              "instructions": "Bkash2",
              "config": []
            },
            "message": "Payment method updated successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/offline-payments/fdsf"
      method: PUT
      body:
        type: json
        data: |-
          {
            "is_enabled": true,
            "is_offline": false,
            "name": "Bkash222",
            "icon": "cash",
            "instructions": "Bkash2"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

docs: |-
  ## Edit Payment Method
