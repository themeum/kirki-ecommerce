info:
  name: Get By Id (Payment Method)
  type: http
  seq: 1
  tags:
    - offline-payments

http:
  method: GET
  url: "{{baseUrl}}/offline-payments/fdsf"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/offline-payments/fdsf"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "fdsf",
              "name": "Cash on Delivery",
              "icon": "cash",
              "is_enabled": true,
              "is_offline": true,
              "description": "Cash on Delivery"
            },
            "message": "Payment method retrieved successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/offline-payments/fdsf"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Currency not found."
          }

docs: |-
  # Get Payment Method by ID
  Returns the details of a specific resource identified by its ID.
