info:
  name: Set Enabled (Payment Method)
  type: http
  seq: 6
  tags:
    - offline-payments

http:
  method: PATCH
  url: "{{baseUrl}}/offline-payments/98cfccbb-9f87-41d7-b66a-95ab95502ff9"
  body:
    type: json
    data: |-
      {
        "is_enabled": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/offline-payments/98cfccbb-9f87-41d7-b66a-95ab95502ff9"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "is_enabled": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": true,
            "message": "Payment method updated",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/offline-payments/does-not-exist"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "is_enabled": false
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "message": "Payment method not found."
          }

docs: |-
  ## Set Enabled (Payment Method)
  Enables or disables an offline payment method. Only `is_enabled` is read; the
  method's name, icon, instructions and configuration are left unchanged.
