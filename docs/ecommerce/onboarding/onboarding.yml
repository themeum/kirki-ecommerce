info:
  name: Onboarding
  type: http
  seq: 1
  tags:
    - onboarding

http:
  method: POST
  url: "{{baseUrl}}/onboarding"
  body:
    type: json
    data: |-
      {
        "store_name": "Ecommerce",
        "industry": "Food",
        "store_address": {
          "address_line_1": "Dhaka",
          "address_line_2": null,
          "city": "Dhaka",
          "state": "Dhaka",
          "postal_code": "1200",
          "country": "Bangladesh"
        },
        "default_currency": "usd"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/onboarding"
      method: POST
      body:
        type: json
        data: |-
          {
            "store_name": "Ecommerce",
            "industry": "Food",
            "store_address": {
              "address_line_1": "Dhaka",
              "address_line_2": null,
              "city": "Dhaka",
              "state": "Dhaka",
              "postal_code": "1200",
              "country": "Bangladesh"
            },
            "default_currency": "usd"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [],
            "message": "Onboarding settings updated successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/onboarding"
      method: POST
      body:
        type: json
        data: |-
          {
            "store_name": "Ecommerce",
            "industry": "Food",
            "store_address": {
              "address_line_1": "Dhaka",
              "address_line_2": null,
              "city": "Dhaka",
              "state": "Dhaka",
              "postal_code": "1200",
              "country": "Bangladesh"
            },
            "default_currency": "usd"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"

