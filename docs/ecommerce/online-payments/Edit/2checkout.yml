info:
  name: 2checkout
  type: http
  seq: 7
  tags:
    - online-payments

http:
  method: PUT
  url: "{{baseUrl}}/online-payments/twocheckout"
  body:
    type: json
    data: |-
      {
        "data": {
          "merchant_code": "256172060889",
          "secret_key": "r)WXbzTMhq3x5nZdRCu[",
          "buy_link_secret_word" : "cYa7!gP2GWu$Ng$*$Ttd@#mN!pFGJ??pFPsmVdzRwWu?2kQ6Q#VK5ruZTd@2ns8z",
          "sandbox": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/online-payments/quickpay"
      method: PUT
      body:
        type: json
        data: |-
          {
            "data": {
              "merchant_code": "256172060889",
              "secret_key": "r)WXbzTMhq3x5nZdRCu[",
              "buy_link_secret_word" : "cYa7!gP2GWu$Ng$*$Ttd@#mN!pFGJ??pFPsmVdzRwWu?2kQ6Q#VK5ruZTd@2ns8z",
              "sandbox": true
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "twocheckout",
