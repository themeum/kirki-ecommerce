info:
  name: Authorize.Net
  type: http
  seq: 2
  tags:
    - online-payments

http:
  method: PUT
  url: "{{baseUrl}}/online-payments/authorizenet"
  body:
    type: json
    data: |-
      {
        "data": {
          "login_id": "3a8V3b5Yz2",
          "transaction_key": "9NGG9rdvk2e657MZ",
          "signature_key": "93A6568827835B162331CC78CDB0565F49ADBEBEE47309ED6B859687AAF18ACBBDF3B3AA065717E86365B41FD3ABF9E68F04BA3359471BF27AA312C962E0A10C",
          "sandbox": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/online-payments/authorizenet"
      method: PUT
      body:
        type: json
        data: |-
          {
            "data": {
              "login_id": "3a8V3b5Yz2",
              "transaction_key": "9NGG9rdvk2e657MZ",
