info:
  name: QuickPay
  type: http
  seq: 5
  tags:
    - online-payments

http:
  method: PUT
  url: "{{baseUrl}}/online-payments/quickpay"
  body:
    type: json
    data: |-
      {
        "data": {
          "api_key": "<api_key>",
          "private_key": "<private_key>",
          "sandbox": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/online-payments/quickpay"
      method: PUT
      body:
        type: json
        data: |-
          {
            "data": {
               "api_key": "<api_key>",
              "private_key": "<private_key>",
              "sandbox": true
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "quickpay",
              "name": "QuickPay",
              "icon": "quickpay",
              "is_enabled": true,
              "is_offline": false,
              "description": "QuickPay payment gateway",
              "settings": {
              "api_key": "<api_key>",
              "private_key": "<private_key>",
              "sandbox": true
              },
              "fields": [
                {
                  "name": "api_key",
                  "label": "API Key",
                  "type": "text",
                  "required": true
                },
                {
                  "name": "private_key",
                  "label": "Private Key",
                  "type": "password",
                  "required": true
                },

                {
                  "name": "sandbox",
                  "label": "Sandbox",
                  "type": "checkbox",
                  "required": true
                }
              ],
              "webhook_url": "http://droip.local/wp-json/droip/ecommerce/v1/payment/webhook/quickpay",
              "webhook_events": [

              ]
            },
            "message": "Payment method updated successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/online-payments/quickpay"
      method: PUT
      body:
        type: json
        data: |-
          {
           "data": {
               "api_key": "<api_key>",
              "private_key": "<private_key>",
              "sandbox": true
            }
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

