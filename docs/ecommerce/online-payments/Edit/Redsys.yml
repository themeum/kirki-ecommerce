info:
  name: Redsys
  type: http
  seq: 9
  tags:
    - online-payments

http:
  method: PUT
  url: "{{baseUrl}}/online-payments/redsys"
  body:
    type: json
    data: |-
      {
        "data": {
          "merchant_code": "263100000",
          "signature_key": "sq7HjrUOBfKmC576",
          "terminal": 9,
          "sandbox": true
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

