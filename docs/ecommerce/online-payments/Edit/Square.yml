        data: |-
          {
            "data": {
              "location_id": "LEGT83VZEV5V2",
              "access_token": "EAAAl4LdTXfnmyIKtc9NU-n0IZMw8roh8N12PXXWnfwI0q2me70hEDkzMP_iyfnz",
              "signature_key": "LEh7OzsPmA8jIRPfTDKR4g",
              "sandbox": true
            }
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

