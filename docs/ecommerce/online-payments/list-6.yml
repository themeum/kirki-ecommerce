info:
  name: List (Payment Gateway)
  type: http
  seq: 3
  tags:
    - online-payments

http:
  method: GET
  url: "{{baseUrl}}/online-payments"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/online-payments"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "stripe",
                "name": "Stripe",
                "icon": "stripe",
                "is_enabled": false,
                "is_offline": false,
                "description": "Stripe payment gateway"
              }
            ],
            "message": "Payment methods retrieved successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/online-payments"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Order direction must be either \"asc\" or \"desc\"."
          }

docs: |-
  ## Payment Method List
  Returns a paginated collection of resources. Supports optional search, filter, sort, and order parameters to refine the results.
