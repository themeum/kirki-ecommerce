docs: |-
  ## Calculate Order Edit Preview
  Previews the edit of an existing order without saving it. Send the same payload that you will send to
  `PUT {{baseUrl}}/orders/{id}`, plus `order_id`.

  - A line already on the order is sent with `order_item_id`. It keeps its stored price. A new line is sent with `variant_id`.
  - Coupons, exchange rate, tax mode, and the shipping charge and tax rates are the ones stored on the order.
    Shipping and tax are quoted again only when the delivery country or state, or the shipping method, changes.
  - The preview applies the same quantity, per-order limit and stock rules as the save, so it gives the same 422 errors.
    It does not reserve stock.

  ### Item keys
  `order_item_id` (null for a new line), `is_reachable` (false for a locked line), and the live variant values
  `allow_back_order`, `track_inventory`, `available_quantity`, `in_stock`, `has_limit_per_order`, `max_per_order`
  (all null when the variant was deleted).

  ### Errors
  - 404: the order does not exist.
  - 422: the order cannot be edited, a locked line changed quantity, a quantity or new line is above `max_per_order`, or stock is short.

  Full rules: `docs/order-editing.md`.
