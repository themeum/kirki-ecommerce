info:
  name: Delete (Order)
  type: http
  seq: 9
  tags:
    - orders

http:
  method: DELETE
  url: "{{baseUrl}}/orders/13"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/orders/13"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": 1,
            "message": "Order deleted successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/orders/13"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Order not found."
          }

docs: |-
  ## Delete an Order

  Deletes an existing resource identified by its ID.
