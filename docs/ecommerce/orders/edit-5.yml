docs: |-
  ## Edit Order
  Edits an order that is not paid, not cancelled and not shipped. The edit keeps what the
  customer was promised: line prices, coupon terms, exchange rate, tax mode, and the shipping
  charge and tax rates for an address that did not change. Full rules: `docs/order-editing.md`.

  ### Lines
  - A line already on the order is sent with `order_item_id` (the `id` of the item in the order response).
  - A new line is sent with `variant_id`. A line left out of the payload is removed and its stock is given back.
  - `currency_code` is optional. When sent, it must equal the order's currency.
  - A coupon code that is already on the order stays with its stored terms. A new code is checked and priced from the coupon.

  ### Errors
  - 404: the order does not exist.
  - 422: the order cannot be edited; a locked line changed quantity; a raised quantity or a new line is above
    `max_per_order`; stock is short for an added quantity; the shipping method is not valid for a new address.
  - Use `POST {{baseUrl}}/calculate/order` with an `order_id` to preview the same edit. It gives the same 422 errors.
