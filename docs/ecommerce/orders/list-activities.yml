info:
  name: List Activities (Order)
  type: http
  seq: 11
  tags:
    - orders

http:
  method: GET
  url: "{{baseUrl}}/orders/1/activities?page=1&limit=2"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/orders/4/activities"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "results": [
                {
                  "id": 13,
                  "order_id": 4,
                  "activity_type": "comment-added",
                  "description": "Customer called about the delivery window, promised a callback tomorrow.",
                  "created_by": 1,
                  "author_name": "Admin",
                  "created_at": "2026-08-24 09:15:42"
                },
                {
                  "id": 12,
                  "order_id": 4,
                  "activity_type": "comment-added",
                  "description": "Packed and ready to ship.",
                  "created_by": 1,
                  "author_name": "Admin",
                  "created_at": "2026-08-23 14:02:10"
                },
                {
                  "id": 11,
                  "order_id": 4,
                  "activity_type": "order-placed",
                  "description": "Order placed for Classic Cotton T-Shirt #ORD-6A8D37D5A1299",
                  "created_by": 11,
                  "author_name": "Jane Doe",
                  "created_at": "2026-08-23 06:36:05"
                }
              ],
              "total": 3,
              "count": 3,
              "per_page": 10,
              "current_page": 1,
              "last_page": 1,
              "from": 1,
              "to": 3,
              "has_more_pages": false
            },
            "message": "Activities retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/orders/4/activities"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Order not found.",
            "success": false
          }

docs: |-
  ## List Order Activities

  Returns a paginated activity timeline for an order — every system-recorded
  lifecycle event (`order-placed`, `payment-completed`, `shipped`,
  `refunded`, ...) plus every admin comment (`comment-added`) — ordered
  newest first.

  - `page` / `limit` behave like every other list endpoint in this
    collection: `limit` defaults to 10, `page` defaults to 1. Pass
    `limit=-1` to get every activity back on a single page (still wrapped
    in the same envelope, with `total`/`count` equal to the full count).
  - `description` is generated for display: for `comment-added` it's the
    admin's message verbatim; for every other type it's built at read time
    from `activity_type` + stored metadata, so wording can be improved
    later without touching stored data.
  - `author_name` resolves the WordPress display name for `created_by`
    when there is one; a purely system-triggered activity with no acting
    user has both `created_by` and `author_name` as `null`.
  - Currently reachable activity types are `order-placed` (recorded when
    the order is created) and `comment-added` (recorded via **Add
    Comment**) — the rest of the taxonomy exists and is described, but
    isn't wired into order lifecycle actions yet.
