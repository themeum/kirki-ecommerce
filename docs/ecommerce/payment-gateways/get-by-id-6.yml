info:
  name: Get By Id (Payment Gateway)
  type: http
  seq: 2
  tags:
    - payment-gateways

http:
  method: GET
  url: "{{baseUrl}}/payment-gateways/authorizenet"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/payment-gateways/stripe"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": {
              "id": "stripe",
              "name": "Stripe",
              "icon": "stripe",
              "is_enabled": true,
              "is_manual": false,
              "description": "Stripe payment gateway",
              "settings": {
                "is_enabled": true,
                "publishable_key": "pk_test_51Ssd7hCjeaAiRLwdjA364H9sPKLHHfVdbIvg7tdnXZsq8fvLEVzpe8f7rGe0qwx8aAtjceCLvBtzPrC5QK66u14b00rIsKTNg5",
                "secret_key": "sk_test_51Ssd7hCjeaAiRLwdNGeXgSAj3EGxTEtHwTQeOEAGuRP0JeyGatuQidGAFVDlnwBGZcdf53qrg2p92z4CE5hcL55i00gdIVXemi",
                "webhook_secret": "whsec_koUc0U92I4eL5wSm5zIhN66Ot5o2NckD"
              },
              "fields": [
                {
                  "name": "is_enabled",
                  "label": "Enable",
                  "type": "checkbox",
                  "required": true
                },
                {
                  "name": "publishable_key",
                  "label": "Publishable Key",
                  "type": "text",
                  "required": true
                },
                {
                  "name": "secret_key",
                  "label": "Secret Key",
                  "type": "text",
                  "required": true
                },
                {
                  "name": "webhook_secret",
                  "label": "Webhook Secret",
                  "type": "text",
                  "required": true
                }
              ],
              "webhook_url": "http://droip.local/wp-json/droip/ecommerce/v1/payment/webhook/stripe",
              "webhook_events": [
                "checkout.session.completed",
                "checkout.session.async_payment_succeeded",
                "checkout.session.async_payment_failed",
                "charge.refunded",
                "charge.dispute.created",
                "charge.dispute.closed",
                "charge.succeeded"
              ]
            },
            "message": "Payment method retrieved successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/payment-gateways/stripe"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Currency not found."
          }

docs: |-
  # Get Payment Method by ID
  Returns the details of a specific resource identified by its ID.
