info:
  name: Set Enabled
  type: http
  seq: 1
  tags:
    - payment-gateways

http:
  method: PATCH
  url: "{{baseUrl}}/payment-gateways/mollie"
  body:
    type: json
    data: |-
      {
        "is_enabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/payment-gateways/stripe"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "is_enabled": true
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": true,
            "message": "Payment method updated successfully.",
            "success": true
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/payment-gateways/stripe"
      method: PATCH
      body:
        type: json
        data: |-
          {
            "is_enabled": true
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {
              "name": [
                "The name field is required."
              ]
            },
            "message": "Validation failed!"
          }

docs: |-
  ## Edit Payment Method
  Updates an existing resource with the provided data.
