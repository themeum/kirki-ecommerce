info:
  name: Reorder (Payment Methods)
  type: http
  seq: 2
  tags:
    - payment-methods

http:
  method: PUT
  url: "{{baseUrl}}/payment-methods/order"
  body:
    type: json
    data: |-
      {
        "ids": ["paypal", "cash-on-delivery"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/payment-methods/order"
      method: PUT
      body:
        type: json
        data: |-
          {
            "ids": ["paypal", "cash-on-delivery"]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "data": [
              {
                "id": "paypal",
                "name": "PayPal",
                "icon": "https://example.com/logo.svg",
                "icon_media": null,
                "is_enabled": false,
                "is_offline": false,
                "description": "PayPal payment gateway"
              },
              {
                "id": "cash-on-delivery",
                "name": "Cash on Delivery",
                "icon": null,
                "icon_media": null,
                "is_enabled": true,
                "is_offline": true,
                "description": "Pay the courier on delivery."
              }
            ],
            "message": "Payment methods reordered.",
            "success": true
          }
  - name: 422 Response
    description: Failure
    request:
      url: "{{baseUrl}}/payment-methods/order"
      method: PUT
      body:
        type: json
        data: |-
          {
            "ids": ["paypal", "does-not-exist"]
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Validation failed!",
            "errors": {
              "ids": [
                "One or more payment methods do not exist."
              ]
            },
            "success": false
          }
