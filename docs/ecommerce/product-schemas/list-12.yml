info:
  name: List (Product Schema)
  type: http
  seq: 5
  tags:
    - product-schemas

http:
  method: GET
  url: "{{baseUrl}}/product-schemas"
  params:
    - name: search
      value: ""
      type: query
    - name: sort_by
      value: id
      type: query
    - name: sort_order
      value: asc
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/product-schemas"
      method: GET
      params:
        - name: search
          value: ""
          type: query
        - name: sort_by
          value: id
          type: query
        - name: sort_order
          value: asc
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "results": [
                {
                  "id": 1,
                  "name": "Heavy Weight",
                  "created_at": "2025-11-26 10:52:00",
                  "updated_at": "2025-11-26 10:52:00"
                }
              ],
              "total": 1,
              "count": 1,
              "per_page": "10",
              "current_page": "1",
              "last_page": 1,
              "from": 1,
              "to": 1,
              "has_more_pages": false
            },
            "message": "Shipping profiles retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/product-schemas"
      method: GET
      params:
        - name: search
          value: ""
          type: query
        - name: sort_by
          value: id
          type: query
        - name: sort_order
          value: asc
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Order direction must be either \"asc\" or \"desc\"."
          }

docs: |-
  ## Product Schema List
  Returns a paginated collection of resources. Supports optional search, filter, sort, and order parameters to refine the results.
