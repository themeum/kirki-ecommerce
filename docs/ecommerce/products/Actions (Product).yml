info:
  name: Actions (Product)
  type: http
  seq: 12
  tags:
    - products

http:
  method: POST
  url: "{{baseUrl}}/products/56/duplicate"
  body:
    type: json
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/products/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              104,
              106
            ]
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": true,
            "message": "Product deleted successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/products/bulk"
      method: POST
      body:
        type: json
        data: |-
          {
            "action": "delete",
            "ids": [
              104,
              106
            ]
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Products could not be deleted."
          }

docs: |-
  ## Bulk Actions

  Performs a specified action (e.g., delete) on multiple resources identified by their IDs.
