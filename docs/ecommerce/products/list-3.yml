info:
  name: List (Product)
  type: http
  seq: 7
  tags:
    - products

http:
  method: GET
  url: "{{baseUrl}}/products"
  params:
    - name: search
      value: ""
      type: query
      disabled: true
    - name: sort_by
      value: id
      type: query
      disabled: true
    - name: sort_order
      value: asc
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: limit
      value: "-1"
      type: query
      disabled: true
    - name: category_ids
      value: 1,2
      type: query
      disabled: true
    - name: brand_id
      value: "5"
      type: query
      disabled: true
    - name: collection_id
      value: "2"
      type: query
      disabled: true
    - name: status
      value: published
      type: query
      disabled: true
    - name: inventory_type
      value: in_stock
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/products"
      method: GET
      params:
        - name: search
          value: ""
          type: query
        - name: sort_by
          value: id
          type: query
        - name: sort_order
          value: asc
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "-1"
          type: query
        - name: category_ids
          value: 1,2
          type: query
        - name: brand_id
          value: "5"
          type: query
        - name: collection_id
          value: "2"
          type: query
        - name: status
          value: published
          type: query
        - name: inventory_type
          value: in_stock
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "results": [
                {
                  "id": 5,
                  "title": "Classic Cotton T-Shirt",
