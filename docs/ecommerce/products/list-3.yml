          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/products"
      method: GET
      params:
        - name: search
          value: ""
          type: query
        - name: sort_by
          value: id
          type: query
        - name: sort_order
          value: asc
          type: query
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "-1"
          type: query
        - name: category_ids
          value: 1,2
          type: query
        - name: brand_id
          value: "5"
          type: query
        - name: collection_id
          value: "2"
          type: query
        - name: status
          value: published
          type: query
        - name: inventory_type
          value: in_stock
          type: query
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Order direction must be either \"asc\" or \"desc\"."
          }

docs: |-
  ## Product List
  Returns a paginated collection of resources. Supports optional search, filter, sort, and order parameters to refine the results.
