info:
  name: Product settings
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/settings"
  body:
    type: json
    data: |-
      {
        "key": "product",
        "data": {
          "weight_unit": "kg",
          "dimension_unit": "cm",
          "is_enabled_reviews": true,
          "is_enabled_star_ratings": true,
          "is_unit_price_visible": false,
          "low_stock_threshold": 0
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
