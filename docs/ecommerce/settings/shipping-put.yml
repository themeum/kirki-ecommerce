info:
  name: Shipping (PUT)
  type: http
  seq: 2
  tags:
    - settings

http:
  method: PUT
  url: "{{baseUrl}}/settings"
  body:
    type: json
    data: |-
      {
        "key": "shipping",
        "data": {
          "shipping_zones": [
            {
              "id": "f12fdsfsdfsdf343432jh0",
