info:
  name: Shipping (PUT)
  type: http
  seq: 2
  tags:
    - settings

http:
  method: PUT
  url: "{{baseUrl}}/settings"
  body:
    type: json
    data: |-
      {
        "key": "shipping",
        "data": {
          "shipping_zones": [
            {
              "id": "f12fdsfsdfsdf343432jh0",
              "is_enabled": true,
              "title": "All Countries",
              "regions": [
                {
                  "country": "BD",
                  "states": [
                    "5665",
                    "6565"
                  ]
                }
              ],
              "shipping_methods": [
                {
                  "id": "fsdfdsfsdfsdf343432jh4",
                  "is_enabled": true,
                  "name": "Standard Delivery",
                  "type": "flat_rate",
                  "amount": 14,
                  "is_taxable": true,
                  "description": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "product_profile",
                          "operator": "=",
                          "value": "fragile"
                        }
                      ],
                      "action": {
                        "type": "set_shipping_cost",
                        "value": 5
                      }
                    },
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "shipping_profile",
                          "operator": "=",
                          "value": "2"
                        }
                      ],
                      "action": {
                        "type": "add_shipping_cost",
                        "value": 50
                      }
                    }
                  ]
                },
                {
                  "id": "fsdfdsfsd56df343432jh4",
                  "is_enabled": true,
                  "name": "Local Pickup",
                  "type": "local_pickup",
                  "address": null,
                  "has_fee": false,
                  "amount": 9,
                  "description": null,
                  "has_pick_time": false,
                  "pickup_time_start": null,
                  "pickup_time_end": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "product_profile",
                          "operator": "=",
                          "value": "fragile"
                        }
                      ],
                      "action": {
                        "type": "set_shipping_cost",
                        "value": 5
                      }
                    }
                  ]
                },
                {
                  "id": "f12fdsfsdfsdf343432jh4",
                  "is_enabled": true,
                  "name": "Rate by Weight",
                  "type": "weight",
                  "ranges": [
                    {
                      "from": 0,
                      "to": 1,
                      "amount": 5
                    },
                    {
                      "from": 1,
                      "to": 2,
                      "amount": 10
                    }
                  ],
                  "amount": 30,
                  "is_free_shipping_enabled": false,
                  "free_shipping_min_amount": 10,
                  "is_taxable": false,
                  "description": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "product_profile",
                          "operator": "=",
                          "value": "fragile"
                        }
                      ],
                      "action": {
                        "type": "shipping_cost",
                        "value": 5
                      }
                    }
                  ]
                }
              ],
              "shipping_carriers": [
                {
                  "is_enabled": true,
                  "name": "DHL",
                  "type": "flat_rate",
                  "rate": 10,
                  "is_taxable": true,
                  "description": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "product_profile",
                          "operator": "=",
                          "value": "fragile"
                        }
                      ],
                      "action": {
                        "type": "shipping_cost",
                        "value": 5
                      }
                    }
                  ]
                }
              ]
            }
          ]
        }
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

