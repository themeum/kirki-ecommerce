                {
                  "id": "fsdfdsfsdfsdf343432jh4",
                  "is_enabled": true,
                  "name": "Standard Delivery",
                  "type": "flat_rate",
                  "base_amount": 14,
                  "is_taxable": true,
                  "description": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "cart_weight",
                          "operator": ">",
                          "value": 5
                        }
                      ],
                      "action": {
                        "type": "set_shipping_cost",
                        "value": 5
                      }
                    },
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "shipping_profile",
                          "operator": "=",
                          "value": "2"
                        }
                      ],
                      "action": {
                        "type": "add_shipping_cost",
                        "value": 50
                      }
                    }
                  ]
                },
                {
                  "id": "fsdfdsfsd56df343432jh4",
                  "is_enabled": true,
                  "name": "Local Pickup",
                  "type": "local_pickup",
                  "address": null,
                  "has_fee": false,
                  "base_amount": 9,
                  "description": null,
                  "has_pick_time": false,
                  "pickup_time_start": null,
                  "pickup_time_end": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "cart_weight",
                          "operator": ">",
                          "value": 5
                        }
                      ],
                      "action": {
                        "type": "set_shipping_cost",
                        "value": 5
                      }
                    }
                  ]
                },
                {
                  "id": "f12fdsfsdfsdf343432jh4",
                  "is_enabled": true,
                  "name": "Rate by Weight",
                  "type": "weight",
                  "ranges": [
                    {
                      "from": 0,
                      "to": 1,
                      "base_amount": 5
                    },
                    {
                      "from": 1,
                      "to": 2,
                      "base_amount": 10
                    }
                  ],
                  "base_amount": 30,
                  "is_free_shipping_enabled": false,
                  "base_free_shipping_min_amount": 10,
                  "is_taxable": false,
                  "description": null,
                  "shipping_rules": [
                    {
                      "relation": "AND",
                      "conditions": [
                        {
                          "type": "cart_weight",
                          "operator": ">",
                          "value": 5
                        }
                      ],
                      "action": {
                        "type": "shipping_cost",
                        "value": 5
                      }
                    }
                  ]
                }
              ],
              "shipping_carriers": [
                {
                  "id": "ups",
                  "preset": "ups",
                  "name": "UPS",
                  "tracking_url": "https://www.ups.com/track?loc=en_US&tracknum={tracking_number}",
                  "logo": null,
                  "is_enabled": true
                },
                {
                  "id": "dhl",
                  "preset": "dhl",
                  "name": "DHL",
                  "tracking_url": "https://www.dhl.com/global-en/home/tracking/tracking-express.html?submit=1&tracking-id={tracking_number}",
                  "logo": null,
                  "is_enabled": false
                },
                {
                  "id": "4c0b6f4e-8c0b-4c8e-9a52-5a9f4f6f2d11",
                  "preset": null,
                  "name": "Local Courier",
                  "tracking_url": "https://track.example.com/?n={tracking_number}",
                  "logo": null,
                  "is_enabled": true
                }
              ]
            }
          ]
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

