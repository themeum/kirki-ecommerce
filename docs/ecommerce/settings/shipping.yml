info:
  name: Shipping
  type: http
  seq: 1
  tags:
    - settings

http:
  method: GET
  url: "{{baseUrl}}/settings/shipping"
  body:
    type: form-urlencoded
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

