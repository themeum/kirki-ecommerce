info:
  name: Get By Id (Shipping Profile)
  type: http
  seq: 2
  tags:
    - shipping-profiles

http:
  method: GET
  url: "{{baseUrl}}/shipping-profiles/1"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/shipping-profiles/1"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 1,
              "name": "Heavy Weight",
              "created_at": "2025-11-26 10:52:00",
              "updated_at": "2025-11-26 10:55:21"
            },
            "message": "Shipping profile retrieved successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/shipping-profiles/1"
      method: GET
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Shipping profile not found."
          }

docs: |-
  # Get Shipping Profile By ID
  Returns the details of a specific resource identified by its ID.
