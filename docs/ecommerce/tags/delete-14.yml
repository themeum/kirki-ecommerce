info:
  name: Delete (Tag)
  type: http
  seq: 4
  tags:
    - tags

http:
  method: DELETE
  url: "{{baseUrl}}/tags/29"
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/tags/29"
      method: DELETE
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": true,
            "message": "Tag deleted successfully."
          }
  - name: 404 Response
    description: Failure
    request:
      url: "{{baseUrl}}/tags/29"
      method: DELETE
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "errors": {},
            "message": "Tag could not be deleted."
          }

docs: |-
  ## Delete a Tag

  Deletes an existing resource identified by its ID.
