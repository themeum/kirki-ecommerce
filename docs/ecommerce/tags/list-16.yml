info:
  name: List (Tag)
  type: http
  seq: 2
  tags:
    - tags

http:
  method: GET
  url: "{{baseUrl}}/tags"
  params:
    - name: search
      value: ""
      type: query
    - name: sort_by
      value: name
      type: query
    - name: sort_order
      value: asc
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

