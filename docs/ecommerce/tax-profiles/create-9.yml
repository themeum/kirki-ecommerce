info:
  name: Create (Tax Profile)
  type: http
  seq: 4
  tags:
    - tax-profiles

http:
  method: POST
  url: "{{baseUrl}}/tax-profiles"
  body:
    type: json
    data: |-
      {
        "name": "Heavy Weight"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Success
    request:
      url: "{{baseUrl}}/tax-profiles"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Heavy Weight"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": {
              "id": 1,
              "name": "Heavy Weight",
              "created_at": {
                "date": "2025-11-26 10:52:00.147628",
                "timezone_type": 3,
                "timezone": "UTC"
              },
              "updated_at": {
                "date": "2025-11-26 10:52:00.147628",
                "timezone_type": 3,
                "timezone": "UTC"
              }
            },
            "message": "Tax profile created successfully."
          }

docs: |-
  # Create Tax Profile

  ## 1. Detailed description of the API function
  This API is designed to create tax profiles.

  Upon successful creation, the API returns a response with a `success` boolean indicating the success of the operation and a `message` which may contain information about the result.
